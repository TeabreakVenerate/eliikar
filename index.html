<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elikar — Campus Essentials &amp; Dorm Pre-Orders</title>
  <meta name="description" content="Pre-order your dorm room kits, study caddies, and stationery essentials for campus resumption.">

  <!-- Google Fonts: Academy & Editorial Heritage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Design Tokens -->
  <link rel="stylesheet" href="styles/tokens.css">
</head>
<body>

  <!-- Main Website Stage -->
  <div id="stage"></div>

  <!-- Sonner-style Toast Container -->
  <div id="toastContainer" class="elikar-toast-container" aria-live="polite"></div>

  <!-- Floating Cart Trigger Pill (Bottom Left) -->
  <button type="button" class="cart-float-btn" onclick="window.openCart()" aria-label="View Shopping Cart">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <span>Cart</span>
    <span class="cart-badge-count" style="display: none;">0</span>
  </button>

  <!-- Telegram Floating Direct Chat Pill (Bottom Right) -->
  <a href="https://t.me/ElisabethAwadje" target="_blank" rel="noopener noreferrer" class="tg-float-pill" aria-label="Chat with Elikar on Telegram">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
    </svg>
    <span>Telegram</span>
  </a>

  <!-- ==========================================================================
       CART SLIDE-OVER DRAWER & BACKDROP
       ========================================================================== -->
  <div id="cartBackdrop" class="cart-backdrop" onclick="window.closeCart()"></div>
  <aside id="cartDrawer" class="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping Cart">
    <!-- Header -->
    <div class="cart-header">
      <div class="cart-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>Your Order Cart</span>
      </div>
      <button type="button" class="cart-close-btn" onclick="window.closeCart()" aria-label="Close cart">&times;</button>
    </div>

    <!-- Body -->
    <div class="cart-body">
      <!-- Empty State -->
      <div id="cartEmptyState" class="cart-empty-state">
        <span class="cart-empty-icon">🎒</span>
        <h4 style="font-size: 1.1rem; font-weight: 800; color: var(--elikar-navy-900); margin-bottom: 0.4rem;">Your cart is empty</h4>
        <p style="font-size: 0.85rem; color: var(--elikar-slate); line-height: 1.45;">Select a campus package or pick individual items from the catalog to start your pre-order.</p>
      </div>

      <!-- Items List -->
      <div id="cartItemsContainer" class="cart-items-list"></div>

      <!-- Checkout Information Form -->
      <div id="cartCheckoutSection" class="cart-checkout-form" style="display: none;">
        <div class="cart-form-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Delivery Details</span>
        </div>

        <div class="cart-field-group">
          <label class="cart-field-label" for="checkoutCustomerName">Full Name *</label>
          <input type="text" id="checkoutCustomerName" class="cart-field-input" placeholder="e.g. Tolani Adeleke" required>
        </div>

        <div class="cart-field-group">
          <label class="cart-field-label" for="checkoutCustomerPhone">WhatsApp / Phone Number *</label>
          <input type="tel" id="checkoutCustomerPhone" class="cart-field-input" placeholder="e.g. 08012345678" required>
        </div>

        <div class="cart-field-group">
          <label class="cart-field-label" for="checkoutCustomerEmail">Email Address (for order copy) *</label>
          <input type="email" id="checkoutCustomerEmail" class="cart-field-input" placeholder="e.g. student@school.edu.ng" required>
        </div>

        <div class="cart-field-group">
          <label class="cart-field-label" for="checkoutCustomerHostel">University, Hostel &amp; Room *</label>
          <input type="text" id="checkoutCustomerHostel" class="cart-field-input" placeholder="e.g. CU, Daniel Hall Room B204" required>
        </div>

        <div class="cart-field-group">
          <label class="cart-field-label" for="checkoutCustomerNotes">Delivery Instructions (optional)</label>
          <input type="text" id="checkoutCustomerNotes" class="cart-field-input" placeholder="e.g. Call before coming to the hostel gate">
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="cart-footer">
      <div class="cart-totals-row">
        <span>Order Total:</span>
        <span id="cartTotalPrice">₦0</span>
      </div>

      <div class="cart-actions-grid">
        <button type="button" class="btn-checkout-wa" onclick="window.checkoutViaWhatsApp()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm5.78 14.12c-.24.68-1.4 1.25-1.93 1.33-.51.08-1.16.11-3.69-.93-3.23-1.33-5.32-4.63-5.48-4.84-.16-.21-1.3-1.73-1.3-3.3 0-1.57.82-2.35 1.11-2.67.29-.32.63-.4.84-.4.21 0 .42 0 .61.01.2.01.46-.07.72.55.27.63.91 2.22.99 2.38.08.16.13.35.03.56-.11.21-.16.35-.32.53-.16.19-.34.42-.48.56-.16.16-.33.34-.14.66.19.32.84 1.39 1.8 2.25 1.24 1.1 2.29 1.45 2.62 1.61.32.16.51.13.7-.08.19-.21.82-.95 1.04-1.28.21-.32.42-.27.72-.16.29.11 1.87.88 2.19 1.04.32.16.53.24.61.37.08.13.08.77-.16 1.45z"/>
          </svg>
          <span>Order on WhatsApp</span>
        </button>

        <button type="button" class="btn-checkout-tg" onclick="window.checkoutViaTelegram()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
          </svg>
          <span>Order on Telegram</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Application Scripts -->
  <script src="data/products.js"></script>
  <script src="js/variants/bespoke-studio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
