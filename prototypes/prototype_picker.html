<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elikar — Prototypes Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/picker.css">
</head>
<body>

  <!-- Dynamic Prototype Mount Stage -->
  <div id="stage"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="elikar-toast-container" aria-live="polite"></div>

  <!-- STANDALONE PROTOTYPE PICKER HARNESS (EXACT SPEC FROM PICKER.MD) -->
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Bespoke Studio</button>
    <button class="proto-picker-item">Dual Stream</button>
    <button class="proto-picker-item">Editorial Heritage</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <!-- Load Data and Variant Components -->
  <script src="../data/products.js"></script>
  <script src="../js/variants/bespoke-studio.js"></script>
  <script src="dual-stream.js"></script>
  <script src="editorial-heritage.js"></script>
  <script>
    const variants = [
      variantBespokeStudio,
      variantDualStream,
      variantEditorialHeritage
    ];

    window.smoothScrollTo = function(id) {
      if (!id) return;
      const cleanId = (typeof id === 'string' && id.startsWith('#')) ? id.slice(1) : id;
      const el = document.getElementById(cleanId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    window.showToast = function(msg) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'elikar-toast enter';
      toast.setAttribute('role', 'alert');
      toast.innerHTML = `<span class="elikar-toast-icon">✨</span><span>${msg}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('enter'));
      setTimeout(() => {
        toast.classList.add('enter');
        setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 250);
      }, 3000);
    };

    document.addEventListener('DOMContentLoaded', () => {
      const stage = document.getElementById('stage');
      const picker = document.querySelector('.proto-picker');
      const highlight = picker.querySelector('.proto-picker-highlight');
      const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
      const replay = picker.querySelector('.proto-picker-replay');
      let current = 0;

      function moveHighlight() {
        const el = items[current];
        if (!el || !highlight) return;
        highlight.style.width = el.offsetWidth + 'px';
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        if (!stage || !variants[i]) return;
        stage.innerHTML = '';
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
          window.scrollTo(0, 0);
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      replay?.addEventListener('click', () => mount(current));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
        else if (e.key === 'r' || e.key === 'R') mount(current);
      });

      setActive(0);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        picker.setAttribute('data-ready', '');
        moveHighlight();
      }));
    });
  </script>
</body>
</html>
